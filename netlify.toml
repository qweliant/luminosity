# Fallback only. Each site should set its **package directory** (apps/values or
# apps/relational); Netlify then reads that directory's netlify.toml instead of
# this one. Base directory stays at the repo root for every site — that is
# where bun.lock is and where install has to run.
#
# This file keeps the values site building unchanged for any site that has not
# had a package directory set yet. Once both sites have one, it can go.
#
# NOTE: a site with no package directory falls back here and will build the
# VALUES app whatever domain it is serving. If a new site deploys the wrong
# app, that is the setting to check first.
[build]
  command = "bun run build"
  publish = "apps/values/dist"

# Optional: Directs all arbitrary page paths back to index.html to seamlessly 
# maintain client-side single-page app component state during hard reloads.
[redirects]
  from = "/*"
  to = "/index.html"
  status = 200
